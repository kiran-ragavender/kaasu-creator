services:
  - type: web
    name: kaasu-creator
    # Render has no native Java runtime, so build from the Dockerfile
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        value: jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=60&socketTimeout=60
      - key: DATABASE_USERNAME
        value: postgres.plqgzkbkowfzcyuzefop
      - key: DATABASE_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: THYMELEAF_CACHE
        value: "true"
      - key: SHOW_ERRORS
        value: "never"
      - key: LOG_LEVEL
        value: "WARN"
